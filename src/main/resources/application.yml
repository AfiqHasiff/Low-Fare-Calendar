spring:
  application:
    name: low-fare-calendar
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    gcp:
      pubsub:
        enabled: false

server:
  port: 8080

logging:
  level:
    com.simulated.lowfarecalendar: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    export:
      prometheus:
        enabled: true

lfc:
  tracing:
    enabled: true

  cache:
    hot-route-ttl-seconds: 600
    standard-route-ttl-seconds: 300
    fallback-ttl-seconds: 86400
    jitter-min-pct: 0.10
    jitter-max-pct: 0.30
    warmer-skip-threshold-pct: 0.50
    key-version: "v1"

  hot-routes:
    hot-threshold: 100
    top-k: 50
    decay-min-score: 10
    decay-interval-seconds: 3600

  warming:
    interval-seconds: 300
    lookahead-days: 30

  lock:
    ttl-ms: 5000
    poll-interval-ms: 50
    poll-timeout-ms: 4000

  currency:
    rates:
      usd-myr: 4.47
      usd-thb: 33.50
      usd-usd: 1.00

  providers:
    provider-a:
      price-min-usd: 100.00
      price-max-usd: 500.00
      latency-min-ms: 50
      latency-max-ms: 300
      error-rate: 0.05
      enabled: true
    provider-b:
      price-min-usd: 120.00
      price-max-usd: 480.00
      latency-min-ms: 80
      latency-max-ms: 400
      error-rate: 0.10
      enabled: true
    provider-c:
      price-min-usd: 90.00
      price-max-usd: 520.00
      latency-min-ms: 30
      latency-max-ms: 200
      error-rate: 0.02
      enabled: true

  circuit-breaker:
    sliding-window-size: 20
    minimum-number-of-calls: 10
    failure-rate-threshold: 50
    slow-call-duration-threshold-ms: 1000
    slow-call-rate-threshold: 50
    wait-duration-in-open-state-ms: 5000
    permitted-calls-in-half-open: 3

  pubsub:
    topic: "price-class-sold-out"
    subscription: "price-class-sold-out-sub"
    emulator-host: "localhost:8085"
    enabled: false

  observability:
    per-route-tags-enabled: true
    per-date-tags-enabled: false
